url: "https://abdullahahmad88.github.io"
baseurl: "/my-website-1"
repository: "AbdullahAhmad88/my-website-1"

# Theme settings
remote_theme: "mmistakes/minimal-mistakes@4.24.4"
minimal_mistakes_skin: "contrast"

# Minimal Mistakes requires these plugins
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache

# Sidebar details
author:
  name: "Abdullah Ahmad Mirza"
  bio: "BS Computer Engineering | UET Faisalabad (Section A)"
  location: "Faisalabad, Pakistan"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/abdullah-ahmad-mirza-2b9656378"

# Menu configuration
header:
  nav_links:
    - title: "Home"
      url: "/"
    - title: "About"
      url: "/about/"
    - title: "Blog"
      url: "/blog/"
    - title: "Contact"
      url: "/contact/"

defaults:
  - scope:
      path: ""
    values:
      layout: "single"
      author_profile: true
